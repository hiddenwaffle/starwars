<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAR WARS — Donald Brown, 1979 (Applesoft BASIC, ported to JS)</title>
<style>
  :root {
    --phos: #c8e6c8;
    --phos-bright: #e2f2e2;
    --phos-mid: #88aa88;
    --phos-dim: #5a755a;
    --phos-faint: #2e3d2e;
    --bg: #0a0e0a;
    --bg-soft: #0f140f;
    --page: #141714;
    --frame: #20251f;
    --frame-hi: #2d352c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: var(--page);
    color: var(--phos-dim);
    font-family: 'Menlo', 'Monaco', 'Consolas', 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  #game {
    transform-origin: center center;
    padding: 28px 16px 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  header {
    text-align: center;
    line-height: 1.6;
    max-width: 60ch;
  }
  header .title {
    color: var(--phos);
    font-size: 14px;
    letter-spacing: 0.22em;
  }
  header .sub {
    color: var(--phos-dim);
    font-size: 12px;
    letter-spacing: 0.04em;
    margin-top: 4px;
  }
  .layout {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    grid-template-rows: auto auto;
    grid-template-areas:
      "map term"
      "palette palette";
    gap: 14px;
    width: 860px;
  }

  .map-frame {
    grid-area: map;
    background: var(--bg);
    border: 1px solid var(--frame);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    box-shadow: inset 0 0 24px rgba(120, 200, 120, 0.04);
    position: relative;
  }
  .map-tooltip {
    position: absolute;
    background: var(--bg);
    border: 1px solid var(--phos-mid);
    color: var(--phos-bright);
    padding: 3px 8px;
    font-size: 11px;
    font-family: 'Menlo','Monaco',monospace;
    letter-spacing: 0.06em;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 0 8px rgba(150, 220, 150, 0.20);
    z-index: 10;
    visibility: hidden;
    transform: translate(-50%, calc(-100% - 6px));
  }
  .map-tooltip.active { visibility: visible; }
  .map-svg-wrap {
    flex: 1 1 0;
    background: var(--bg-soft);
    border: 1px solid var(--frame);
    border-radius: 6px;
    min-height: 290px;
    overflow: hidden;
    position: relative;
  }
  .map-svg-wrap svg { display: block; width: 100%; height: 100%; }
  .map-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--phos-dim);
    font-size: 11px;
    letter-spacing: 0.12em;
    pointer-events: none;
    text-align: center;
    padding: 0 12px;
  }
  .room-rect       { fill: var(--phos-faint);  stroke: var(--phos-dim); stroke-width: 1; }
  .room-rect.here  { fill: var(--phos);        stroke: var(--phos-bright); stroke-width: 1.5; }
  .room-rect.peek  { fill: none;               stroke: var(--phos-faint); stroke-width: 1; stroke-dasharray: 2 2; }
  .room-rect.equip-0 {
    fill: rgba(218, 165, 80, 0.40);
    stroke: rgba(230, 180, 90, 0.95);
    stroke-width: 1.5;
    filter: drop-shadow(0 0 2px rgba(230, 180, 90, 0.55));
    animation: equip-pulse 2.4s ease-in-out infinite;
  }
  .room-rect.equip-1 {
    fill: rgba(180, 150, 90, 0.30);
    stroke: rgba(190, 160, 90, 0.75);
    stroke-width: 1;
  }
  .room-rect.equip-2 {
    fill: rgba(80, 100, 80, 0.20);
    stroke: var(--phos-dim);
    stroke-width: 1;
    stroke-dasharray: 2 2;
  }
  .room-rect.here.equip-0 {
    fill: rgba(255, 200, 100, 0.65);
    stroke: var(--phos-bright);
    stroke-width: 2;
  }
  .room-rect.here.equip-1 {
    fill: rgba(220, 190, 110, 0.55);
    stroke: var(--phos-bright);
    stroke-width: 2;
  }
  .room-rect.here.equip-2 {
    fill: rgba(140, 160, 140, 0.45);
    stroke: var(--phos-bright);
    stroke-width: 2;
    stroke-dasharray: 2 2;
  }
  @keyframes equip-pulse {
    0%, 100% { filter: drop-shadow(0 0 2px rgba(230, 180, 90, 0.40)); }
    50%      { filter: drop-shadow(0 0 6px rgba(230, 180, 90, 0.85)); }
  }
  .room-text       { fill: var(--phos-bright); font-size: 9px; font-family: 'Menlo','Monaco',monospace; pointer-events: none; }
  .room-text.here  { fill: var(--bg); }
  .room-text.peek  { fill: var(--phos-dim); }
  .room-text.equip-0 { fill: #ffd577; font-weight: bold; }
  .room-text.equip-1 { fill: #c4a86a; }
  .room-text.equip-2 { fill: var(--phos-dim); }
  .room-text.here.equip-0,
  .room-text.here.equip-1,
  .room-text.here.equip-2 { fill: var(--bg); font-weight: bold; }
  .room-dot { pointer-events: none; }
  .room-dot.equip-0 { fill: rgba(218, 165, 80, 0.85); }
  .room-dot.equip-1 { fill: rgba(180, 150, 90, 0.65); }
  .room-dot.equip-2 { fill: rgba(120, 130, 120, 0.50); }
  .room-dot        { fill: var(--phos-bright); }
  .room-dot.here   { fill: var(--bg); }
  .room-edge       { stroke: var(--phos-dim);  stroke-width: 1; fill: none; }
  .room-edge.chasm { stroke: var(--phos-dim);  stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  .room-edge.peek  { stroke: var(--phos-faint);stroke-width: 1; stroke-dasharray: 2 2; fill: none; }
  .room-edge.peek.chasm { stroke: var(--phos-faint); stroke-dasharray: 3 3; }

  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 32px);
    gap: 4px;
    width: 130px;
    margin: 0 auto;
  }
  .dpad button {
    background: transparent;
    border: 1px solid var(--frame-hi);
    color: var(--phos-mid);
    font-family: inherit;
    font-size: 16px;
    border-radius: 4px;
    cursor: pointer;
    line-height: 1;
    padding: 0;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  .dpad button:hover:not(:disabled) {
    color: var(--phos);
    border-color: var(--phos-mid);
    background: rgba(120, 200, 120, 0.05);
  }
  .dpad button:active:not(:disabled) { transform: translateY(1px); }
  .dpad button:disabled {
    color: var(--phos-faint);
    border-color: var(--frame);
    cursor: not-allowed;
  }
  .dpad button.blocked {
    color: var(--phos-dim);
    border-color: var(--frame-hi);
  }
  .dpad button.blocked:hover {
    color: var(--phos-mid);
    background: rgba(120, 200, 120, 0.04);
  }
  .dpad-n { grid-column: 2; grid-row: 1; }
  .dpad-w { grid-column: 1; grid-row: 2; }
  .dpad-c { grid-column: 2; grid-row: 2; border-style: dashed !important; opacity: 0.5; }
  .dpad-e { grid-column: 3; grid-row: 2; }
  .dpad-s { grid-column: 2; grid-row: 3; }

  .term-frame {
    grid-area: term;
    position: relative;
    background: var(--bg);
    border: 1px solid var(--frame);
    border-radius: 10px;
    padding: 16px 18px;
    height: 522px;
    display: flex;
    flex-direction: column;
    box-shadow:
      inset 0 0 28px rgba(120, 200, 120, 0.05),
      0 0 0 1px rgba(200, 230, 200, 0.02),
      0 8px 28px rgba(0, 0, 0, 0.5);
  }
  .term-frame::after {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: inherit;
    background: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 2px,
      rgba(0, 0, 0, 0.07) 2px,
      rgba(0, 0, 0, 0.07) 3px
    );
  }
  .status, .messages {
    color: var(--phos);
    font-size: 17px;
    line-height: 1.2;
    letter-spacing: 0.02em;
    white-space: pre-wrap;
    word-break: break-word;
    text-shadow: 0 0 2px rgba(200, 230, 200, 0.25);
    position: relative;
    z-index: 1;
  }
  .status { flex: 0 0 auto; padding-bottom: 4px; }
  .status:empty { display: none; }
  .messages { flex: 1 1 0; overflow-y: auto; overflow-x: hidden; padding-top: 6px; }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: #1f291f; border-radius: 3px; }
  .messages-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex: 0 0 auto;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--frame);
    margin-bottom: 6px;
  }
  .messages-label {
    color: var(--phos-mid);
    font-size: 11px;
    letter-spacing: 1px;
  }
  .god-btn {
    background: transparent;
    color: var(--phos-mid);
    border: 1px solid var(--frame-hi);
    font: inherit;
    font-size: 11px;
    padding: 2px 8px;
    cursor: pointer;
    letter-spacing: 1px;
  }
  .god-btn:hover { color: var(--phos-bright); border-color: var(--phos-mid); }
  .god-btn.active { color: var(--phos-bright); border-color: var(--phos); background: rgba(200,230,200,0.08); }
  .messages-header.is-hidden { display: none; }
  .messages-header-btns { display: flex; gap: 6px; }
  .scene-break {
    height: 1px;
    width: 100%;
    margin: 12px 0;
    border: none;
    background: linear-gradient(to right, transparent, var(--phos-dim), transparent);
    box-shadow: 0 0 4px rgba(120, 200, 120, 0.18);
  }
  .inv { background: var(--phos); color: var(--bg); }
  .dim-past { color: var(--phos-dim); }
  .dim-past .inv {
    background: var(--phos-dim);
    color: var(--bg);
  }
  .dim-past .scene-break {
    background: linear-gradient(to right, transparent, var(--phos-faint), transparent);
    box-shadow: none;
  }
  @keyframes flsh { 0%, 49.9% {} 50%, 100% { background: var(--phos); color: var(--bg); } }
  .fls { animation: flsh 0.7s steps(1, end) infinite; }
  .term-input {
    background: transparent;
    border: none;
    color: inherit;
    font: inherit;
    letter-spacing: inherit;
    outline: none;
    padding: 0;
    width: 16ch;
    caret-color: var(--phos);
    text-shadow: inherit;
  }
  /* When typing into the prompt, the palette's per-button key-hint
     underlines hide -- visual cue that keystrokes are being captured
     by the input rather than firing palette shortcuts. */
  body:has(.term-input:focus) .key-hint {
    border-bottom-color: transparent;
  }
  .term-cursor {
    display: inline-block;
    width: 0.5em;
    height: 1em;
    background: var(--phos);
    vertical-align: text-bottom;
    animation: blnk 1s steps(1, end) infinite;
    margin-left: 2px;
  }
  @keyframes blnk { 0%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .palette {
    grid-area: palette;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    border: 1px solid var(--frame);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .palette.pre-game { visibility: hidden; pointer-events: none; }
  body.game-over .dpad { display: none; }
  body.game-over .palette > *:not(.more-stats-btn):not(.palette-restart-btn) { display: none; }
  .more-stats-btn, .palette-restart-btn { display: none; }
  body.game-over .more-stats-btn,
  body.game-over .palette-restart-btn { display: inline-block; }
  body.game-over .footer-actions { display: none; }
  .palette-restart-btn.armed { color: var(--phos); border-color: var(--phos); }
  .palette button, .menu button {
    background: transparent;
    border: 1px solid var(--frame-hi);
    color: var(--phos-mid);
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.1em;
    padding: 6px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.12s, border-color 0.12s, background 0.12s;
  }
  .palette button:hover, .menu button:hover {
    color: var(--phos);
    border-color: var(--phos-mid);
    background: rgba(120, 200, 120, 0.05);
  }
  .palette button:active { transform: translateY(1px); }
  .palette button.lifebar {
    position: relative;
  }
  .palette button.lifebar::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: var(--phos);
    transform-origin: left center;
    transform: scaleX(var(--life, 1));
    transition: transform 0.4s ease-out;
    pointer-events: none;
  }
  .palette button.is-on {
    color: var(--phos-bright);
    border-color: var(--phos);
    background: rgba(120, 200, 120, 0.08);
    box-shadow: 0 0 8px rgba(150, 220, 150, 0.35), inset 0 0 4px rgba(150, 220, 150, 0.2);
    text-shadow: 0 0 3px rgba(200, 255, 200, 0.6);
    animation: sabre-breathe 2.4s ease-in-out infinite;
  }
  @keyframes sabre-breathe {
    0%, 100% { box-shadow: 0 0 6px rgba(150, 220, 150, 0.30), inset 0 0 3px rgba(150, 220, 150, 0.15); }
    50%      { box-shadow: 0 0 12px rgba(150, 220, 150, 0.55), inset 0 0 6px rgba(150, 220, 150, 0.30); }
  }
  .menu-wrap { position: relative; }
  .menu {
    display: none;
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--bg);
    border: 1px solid var(--frame-hi);
    border-radius: 4px;
    padding: 6px;
    min-width: 130px;
    z-index: 10;
    flex-direction: column;
    gap: 4px;
  }
  .menu.open { display: flex; }
  .menu button { font-size: 12px; padding: 5px 10px; }

  /* CHARGE menu: multi-column layout. Each column is its own .menu-style stack
   * (princess, player, wookie). Top-level .menu loses the column flex layout
   * for this variant since .charge-cols is the row container. */
  .menu.charge-menu { flex-direction: row; min-width: 0; padding: 8px; }
  .charge-cols {
    display: flex;
    flex-direction: row;
    gap: 10px;
    align-items: flex-start;
  }
  .charge-col {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }
  .charge-col button { white-space: nowrap; }
  .charge-col-label {
    font-size: 10px;
    color: var(--phos-mid);
    text-align: center;
    letter-spacing: 0.1em;
    padding: 2px 0 4px 0;
    border-bottom: 1px solid var(--frame-hi);
    margin-bottom: 2px;
    max-width: 10ch;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    align-self: center;
  }
  .charge-col button.is-picked {
    color: var(--phos-bright);
    border-color: var(--phos);
    background: var(--bg-soft);
  }
  .charge-col.dim {
    opacity: 0.35;
  }
  .palette .sep { color: transparent; font-size: 12px; letter-spacing: 0.1em; }
  .key-hint {
    border-bottom: 2px solid var(--phos-dim);
    padding-bottom: 1px;
  }
  .key-tag {
    font-size: 0.8em;
    opacity: 0.5;
    margin-left: 2px;
  }
  .key-tag::before { content: '['; }
  .key-tag::after { content: ']'; }

  footer {
    color: var(--phos-dim);
    font-size: 12px;
    text-align: center;
    line-height: 1.7;
    letter-spacing: 0.04em;
    max-width: 60ch;
  }
  .footer-actions {
    margin-top: 18px;
    display: flex;
    justify-content: center;
  }
  .restart-btn {
    background: transparent;
    border: 1px solid var(--frame-hi);
    color: var(--phos-dim);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.22em;
    padding: 6px 18px;
    border-radius: 4px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .restart-btn:hover {
    color: var(--phos-mid);
    border-color: var(--phos-mid);
  }
  .restart-btn.armed {
    color: var(--phos);
    border-color: var(--phos);
  }
  .pi-toggle {
    position: fixed;
    right: 8px;
    bottom: 6px;
    color: var(--phos-faint);
    opacity: 0.5;
    font-family: inherit;
    font-size: 9px;
    line-height: 1;
    user-select: none;
    cursor: pointer;
    padding: 4px;
    z-index: 5;
  }
</style>
</head>
<body>
  <div id="game">
  <header>
    <div class="title">S T A R &nbsp; W A R S</div>
    <div class="sub">Ported by hiddenwaffle 2026 · Original by Donald Brown 1979</div>
  </header>

  <div class="layout">
    <div class="map-frame">
      <div class="map-svg-wrap">
        <svg id="map" viewBox="0 0 280 320" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="map-empty" id="map-empty"></div>
      </div>
      <div class="dpad" id="dpad">
        <button class="dpad-n" data-dir="N" disabled>↑</button>
        <button class="dpad-w" data-dir="W" disabled>←</button>
        <button class="dpad-c" disabled>·</button>
        <button class="dpad-e" data-dir="E" disabled>→</button>
        <button class="dpad-s" data-dir="S" disabled>↓</button>
      </div>
      <div class="map-tooltip" id="map-tooltip"></div>
    </div>

    <div class="term-frame">
      <div class="messages-header is-hidden">
        <span class="messages-label">CONSOLE MESSAGES</span>
        <span class="messages-header-btns">
          <button class="god-btn" id="god-btn" type="button">GOD</button>
          <button class="god-btn" id="charge-test-btn" type="button">CHARGE TEST</button>
          <button class="god-btn" id="rescue-test-btn" type="button">RESCUE TEST</button>
          <button class="god-btn" id="wookie-test-btn" type="button">WOOKIE TEST</button>
          <button class="god-btn" id="swing-test-btn" type="button">SWING TEST</button>
        </span>
      </div>
      <div class="status" id="status"></div>
      <div class="messages" id="messages" tabindex="0"></div>
    </div>

    <div class="palette pre-game" id="palette">
      <button class="more-stats-btn" id="more-stats-btn" type="button" data-key="M"><span class="key-hint">M</span>ORE STATS</button>
      <button class="palette-restart-btn" id="palette-restart-btn" type="button" data-key="R"><span class="key-hint">R</span>ESTART</button>
      <button data-cmd="LOOK" data-key="L"><span class="key-hint">L</span>OOK</button>
      <button data-cmd="HELP" data-key="?"><span class="key-hint">?</span></button>
      <span class="sep">|</span>
      <div class="menu-wrap" id="wrap-get">
        <button id="get-trigger" data-key="G"><span class="key-hint">G</span>ET ▾</button>
        <div class="menu" id="get-menu">
          <button data-cmd="GET SHIELD" data-key="S"><span class="key-hint">S</span>HIELD</button>
          <button data-cmd="GET BLASTER" data-key="B"><span class="key-hint">B</span>LASTER</button>
          <button data-cmd="GET ALL" data-key="A"><span class="key-hint">A</span>LL</button>
        </div>
      </div>
      <div class="menu-wrap" id="wrap-drop">
        <button id="drop-trigger" data-key="D"><span class="key-hint">D</span>ROP ▾</button>
        <div class="menu" id="drop-menu">
          <button data-cmd="DROP SHIELD" data-key="S"><span class="key-hint">S</span>HIELD</button>
          <button data-cmd="DROP BLASTER" data-key="B"><span class="key-hint">B</span>LASTER</button>
        </div>
      </div>
      <span class="sep">|</span>
      <button data-cmd="SABRE" data-key="S"><span class="key-hint">S</span>ABRE</button>
      <div class="menu-wrap" id="wrap-attack">
        <button class="menu-trigger" data-key="T">A<span class="key-hint">T</span>TACK ▾</button>
        <div class="menu">
          <button data-cmd="ATTACK SABRE" data-key="S"><span class="key-hint">S</span>ABRE</button>
          <button data-cmd="ATTACK BLASTER" data-key="B"><span class="key-hint">B</span>LASTER</button>
          <button data-cmd="ATTACK HANDS" data-key="H"><span class="key-hint">H</span>ANDS</button>
        </div>
      </div>
      <button id="auto-attack-btn" type="button" data-key="A"><span class="key-hint">A</span>uto-Attack</button>
      <div class="menu-wrap" id="wrap-charge">
        <button class="menu-trigger" data-key="C"><span class="key-hint">C</span>HARGE ▾</button>
        <div class="menu charge-menu">
          <div class="charge-cols">
            <div class="charge-col" data-charge-col="princess">
              <div class="charge-col-label">PRINCESS</div>
              <button data-charge-pick="princess:S" data-key="1"><span class="key-hint">1</span> SHOOT</button>
              <button data-charge-pick="princess:A" data-key="2"><span class="key-hint">2</span> ATTACK</button>
              <button data-charge-pick="princess:N" data-key="3"><span class="key-hint">3</span> NOTHING</button>
            </div>
            <div class="charge-col" data-charge-col="player">
              <div class="charge-col-label">YOU</div>
              <button data-charge-pick="player:S" data-key="1"><span class="key-hint">1</span> SABRE</button>
              <button data-charge-pick="player:B" data-key="2"><span class="key-hint">2</span> BLASTER</button>
              <button data-charge-pick="player:H" data-key="3"><span class="key-hint">3</span> HANDS</button>

  function wireUi() {
    document.querySelectorAll(".dpad button").forEach((b) => {
      b.disabled = true;
    });
    palette.querySelectorAll("button[data-cmd]").forEach((btn) => {
      btn.addEventListener("click", () => {
        injectCommand(btn.dataset.cmd);
        document.querySelectorAll(".menu.open").forEach((m) => m.classList.remove("open"));
      });
    });
    const autoAttackBtn = document.getElementById("auto-attack-btn");
    if (autoAttackBtn) {
      autoAttackBtn.addEventListener("click", () => {
        injectCommand("ATTACK " + pickBestWeapon());
      });
    }
    let chargeDraft = { princess: null, player: null, wookie: null };
    function resetChargeDraft() {
      chargeDraft = { princess: null, player: null, wookie: null };
      document.querySelectorAll("#wrap-charge .charge-col button.is-picked").forEach((b) => b.classList.remove("is-picked"));
      document.querySelectorAll("#wrap-charge .charge-col").forEach((c) => c.classList.remove("dim"));
    }
    function updateChargeFocus() {
      let foundActive = false;
      for (const col of document.querySelectorAll("#wrap-charge .charge-col")) {
        const colEl = col;
        if (colEl.style.display === "none") continue;
        if (!foundActive && !colEl.querySelector("button.is-picked")) {
          colEl.classList.remove("dim");
          foundActive = true;
        } else {
          colEl.classList.add("dim");
        }
      }
    }
    function fireChargeIfComplete() {
      const cols = document.querySelectorAll("#wrap-charge .charge-col");
      for (const col of cols) {
        if (col.style.display === "none") continue;
        if (!chargeDraft[col.dataset.chargeCol]) return;
      }
      const weaponMap = { S: "SABRE", B: "BLASTER", H: "HANDS" };
      chargePresets = {};
      if (chargeDraft.princess) chargePresets.princess = chargeDraft.princess;
      if (chargeDraft.wookie) chargePresets.wookie = chargeDraft.wookie;
      const weaponWord = weaponMap[chargeDraft.player];
      document.querySelectorAll(".menu.open").forEach((m) => m.classList.remove("open"));
      resetChargeDraft();
      injectCommand("CHARGE " + weaponWord);
    }
    document.querySelectorAll("#wrap-charge button[data-charge-pick]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const [col, val] = btn.dataset.chargePick.split(":");
        chargeDraft[col] = val;
        const colEl = btn.closest(".charge-col");
        colEl.querySelectorAll("button").forEach((b) => b.classList.toggle("is-picked", b === btn));
        updateChargeFocus();
        fireChargeIfComplete();
      });
    });
    const chargeTrigger = document.querySelector("#wrap-charge .menu-trigger");
    if (chargeTrigger) {
      chargeTrigger.addEventListener("click", () => {
        resetChargeDraft();
        updateChargeFocus();
      });
    }
    function toggleMenu(menu, evt) {
      evt.stopPropagation();
      const wasOpen = menu.classList.contains("open");
      document.querySelectorAll(".menu.open").forEach((m) => m.classList.remove("open"));
      if (!wasOpen) menu.classList.add("open");
    }
    document.querySelectorAll(".menu-wrap").forEach((wrap) => {
      const trigger = wrap.querySelector("button");
      const menu = wrap.querySelector(".menu");
      if (trigger && menu) {
        trigger.addEventListener("click", (e) => toggleMenu(menu, e));
      }
    });
    document.addEventListener("click", () => {
      document.querySelectorAll(".menu.open").forEach((m) => m.classList.remove("open"));
    });
    const DIR_NAMES = { N: "NORTH", E: "EAST", W: "WEST", S: "SOUTH" };
    dpad.querySelectorAll("button[data-dir]").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (btn.disabled) return;
        if (!acceptingMoveInput) return;
        injectCommand("MOVE " + DIR_NAMES[btn.dataset.dir]);
      });
    });
    document.addEventListener("keydown", (e) => {
      const tag = document.activeElement && document.activeElement.tagName || "";
      if (tag === "INPUT") return;
      const map = { ArrowUp: "N", ArrowRight: "E", ArrowLeft: "W", ArrowDown: "S" };
      if (map[e.key]) {
        e.preventDefault();
        if (!acceptingMoveInput) return;
        injectCommand("MOVE " + DIR_NAMES[map[e.key]]);
      }
    });
    document.addEventListener("keydown", (e) => {
      if ((document.activeElement?.tagName ?? "") === "INPUT") return;
      if (messages.querySelector(".term-cursor")) return;
      if (e.key === "Escape") {
        document.querySelectorAll(".menu.open").forEach((m) => m.classList.remove("open"));
        return;
      }
      if (e.key === "Enter") {
        const armed = palette.querySelector(".palette-restart-btn.armed");
        if (armed) {
          e.preventDefault();
          armed.click();
        }
        return;
      }
      const key = e.key.length === 1 ? e.key.toUpperCase() : "";
      if (!key) return;
      const openMenu = palette.querySelector(".menu.open");
      if (openMenu) {
        if (openMenu.classList.contains("charge-menu")) {
          for (const col of openMenu.querySelectorAll(".charge-col")) {
            const colEl = col;
            if (colEl.style.display === "none") continue;
            if (colEl.querySelector("button.is-picked")) continue;
            const btn2 = colEl.querySelector(
              'button[data-key="' + key + '"]'
            );
            if (btn2 && btn2.style.display !== "none") {
              e.preventDefault();
              btn2.click();
            }
            return;
          }
          return;
        }
        const btn = openMenu.querySelector(
          'button[data-key="' + key + '"]'
        );
        if (btn && btn.style.display !== "none") {
          e.preventDefault();
          btn.click();
          return;
        }
      }
      for (const el of palette.querySelectorAll('button[data-key="' + key + '"]')) {
        const btn = el;
        if (btn.offsetParent === null) continue;
        if (btn.closest(".menu")) continue;
        const wrap = btn.closest(".menu-wrap");
        if (wrap && wrap.style.display === "none") continue;
        e.preventDefault();
        btn.click();
        return;
      }
    });
    const restartBtn = document.getElementById("restart-btn");
    const godBtn = document.getElementById("god-btn");
    if (godBtn) godBtn.addEventListener("click", godMode);
    const chargeTestBtn = document.getElementById("charge-test-btn");
    if (chargeTestBtn) chargeTestBtn.addEventListener("click", chargeTestSetup);
    const rescueTestBtn = document.getElementById("rescue-test-btn");
    if (rescueTestBtn) rescueTestBtn.addEventListener("click", rescueTestSetup);
    const wookieTestBtn = document.getElementById("wookie-test-btn");
    if (wookieTestBtn) wookieTestBtn.addEventListener("click", wookieTestSetup);
    const swingTestBtn = document.getElementById("swing-test-btn");
    if (swingTestBtn) swingTestBtn.addEventListener("click", swingTestSetup);
    const moreStatsBtn = document.getElementById("more-stats-btn");
    if (moreStatsBtn) {
      moreStatsBtn.addEventListener("click", async () => {
        moreStatsBtn.disabled = true;
        showScoreBreakdown();
        await drainLines();
      });
    }
    const piToggle = document.querySelector(".pi-toggle");
    const devHeader = document.querySelector(".messages-header");
    if (piToggle && devHeader) {
      piToggle.addEventListener("click", () => {
        devHeader.classList.toggle("is-hidden");
      });
    }
    function wireRestart(btn) {
      let armed = false;
      let timer = null;
      const hasKeyHint = !!btn.querySelector(".key-hint");
      const labelArmed = hasKeyHint ? 'CONFIRM <span class="key-hint">R</span>ESTART?' : "CONFIRM RESTART?";
      const labelIdle = hasKeyHint ? '<span class="key-hint">R</span>ESTART' : "RESTART";
      function arm() {
        armed = true;
        btn.innerHTML = labelArmed;
        btn.classList.add("armed");
        if (timer) clearTimeout(timer);
        timer = setTimeout(() => {
          armed = false;
          btn.innerHTML = labelIdle;
          btn.classList.remove("armed");
          timer = null;
        }, 3500);
      }
      function confirm() {
        location.reload();
      }
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        if (!armed) arm();
        else confirm();
      });
    }
    wireRestart(restartBtn);
    const paletteRestartBtn = document.getElementById("palette-restart-btn");
    if (paletteRestartBtn) wireRestart(paletteRestartBtn);
  }
  async function gameLoop() {
    emulatorScale = window.__emulatorScale ?? 6.5;
    soundWaitMult = window.__soundWaitMult ?? 1;
    slowCharDelay = AII_SPEED150_CHAR_MS * emulatorScale;
    pauseBeatMs = 250 * AII_PEEK_FOR_ITER_MS * emulatorScale;
    enterPauseMs = 100 * AII_EMPTY_FOR_ITER_MS * emulatorScale;
    bufferOutput = true;
    updatePalette();
    palette.classList.remove("pre-game");
    await enterRoom();
    while (!gameOver && t8 > 0) {
      vaderMove();
      timeWarn();
      let consumed = false;
      while (!consumed && !gameOver) {
        await renderStatus();
        renderMap();
        updateDpad();
        updatePalette();
        acceptingMoveInput = true;
        const cmd = await input("\nWHAT IS YOUR COMMAND");
        acceptingMoveInput = false;
        consumed = await dispatch(cmd);
        if (consumed) {
          messages.querySelectorAll(".fls").forEach((el) => {
            el.classList.remove("fls");
            el.classList.add("inv");
          });
        }
      }
      if (gameOver) break;
      vaderAttack();
      if (gameOver) break;
      soldiersShoot();
      if (gameOver) break;
      followerEscape();
      selfRepair();
      t8--;
    }
    if (!gameOver && t8 <= 0) timeExpired();
    document.body.classList.add("game-over");
    if (player.room !== 0) {
      renderStatus();
      renderMap();
    }
    nl();
    showScore();
    await drainLines();
  }
  async function main() {
    initGame();
    wireUi();
    await titleScreen();
    clearMessages();
    nl();
    nl();
    nl();
    const name = await input("WHAT IS YOUR NAME", true);
    player.name = name || "CADET";
    await briefing();
    clearMessages();
    await gameLoop();
  }
  function rescueTestSetup() {
    if (!player || !rooms || !princess || !wookie) return;
    player.room = 1;
    princess.room = -2;
    wookie.room = -42;
    wookie.friendly = 0;
    vader.room = 22;
    rooms[1].soldiers = 0;
    rooms[2].soldiers = 0;
    rooms[9].damage = 2;
    s9 = 0;
    curSoldiers = [];
    renderStatus();
    updatePalette();
  }
  function wookieTestSetup() {
    if (!player || !rooms || !princess || !wookie) return;
    player.room = 1;
    wookie.room = -2;
    wookie.friendly = 0;
    princess.room = -42;
    vader.room = 22;
    rooms[1].soldiers = 0;
    rooms[2].soldiers = 0;
    s9 = 0;
    curSoldiers = [];
    renderStatus();
    updatePalette();
  }
  function swingTestSetup() {
    if (!player || !rooms || !princess || !wookie) return;
    player.room = 29;
    flags.ropeUp = true;
    princess.room = -42;
    wookie.room = -2;
    wookie.friendly = 0;
    vader.room = 22;
    rooms[29].soldiers = 0;
    rooms[30].soldiers = 0;
    s9 = 0;
    curSoldiers = [];
    renderStatus();
    updatePalette();
  }
  function godMode() {
    if (!player) return;
    player.hp = 9999999999999;
  }
  function chargeTestSetup() {
    if (!player || !rooms || !princess || !wookie) return;
    princess.room = player.room;
    wookie.room = player.room;
    wookie.friendly = 1;
    princess.shield = 1;
    princess.blaster = 1;
    wookie.shield = 1;
    wookie.blaster = 1;
    player.shield = 9;
    player.blaster = 9;
    player.sabre = 1;
    flags.sabreOn = true;
    rooms[player.room].soldiers = 6;
    s9 = 6;
    curSoldiers = [];
    for (let s = 0; s < 6; s++) {
      curSoldiers.push({ def: irand(16), atk: irand(16) });
    }
    renderStatus();
    updatePalette();
  }
  var designW = 0;
  var designH = 0;
  function fitToViewport() {
    const el = document.getElementById("game");
    if (!el) return;
    if (designW === 0) {
      el.style.transform = "none";
      const rect = el.getBoundingClientRect();
      designW = rect.width;
      designH = rect.height;
      el.style.width = designW + "px";
      el.style.height = designH + "px";
      const pal = document.getElementById("palette");
      if (pal) {
        pal.style.height = pal.getBoundingClientRect().height + "px";
      }
    }
    const scale = Math.min(window.innerWidth / designW, window.innerHeight / designH);
    el.style.transform = `scale(${scale})`;
  }
  window.addEventListener("resize", fitToViewport);
  fitToViewport();
  main().catch((e) => {
    console.error(e);
    out("ERROR: " + e.message);
    nl();
  });
})();
